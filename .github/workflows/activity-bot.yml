name: Activity bot

# Passe tous les 3 jours vers minuit (heure de Paris) pour que Supabase
# ne mette pas la boîte en pause. Écrit « Activity bot » dans un registre
# à part (table activity), donc rien n'apparaît dans la boîte à idées.
on:
  schedule:
    - cron: "0 23 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Écrire « Activity bot » dans Supabase
        env:
          URL: https://zurkvkbilehemrynvwwb.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1cmt2a2JpbGVoZW1yeW52d3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTEzNzEsImV4cCI6MjExMDQ4NzM3MX0.DWvG8jqvvPJTfTcwKpIS1g0BenqECiK9A9UoKHwylVM
        run: |
          curl -fsS -X POST "$URL/rest/v1/activity" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '{"note":"Activity bot"}'
          curl -fsS "$URL/rest/v1/ideas?select=text&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null
          echo "Activity bot OK $(date -u)"

      # GitHub coupe les tâches planifiées d'un dépôt sans activité pendant
      # 60 jours : le 1er du mois, le bot note la date dans un petit fichier.
      - uses: actions/checkout@v4
      - name: Garder le dépôt actif (le 1er du mois)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u > .github/last-activity.txt
            git config user.name "Activity bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-activity.txt
            git commit -m "Activity bot" && git push
          fi
