<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Service Publique — le mur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1c1a; --mute:#8d8c87; --seam:#e1e1dd; --pin:#d4432c;
  --W:clamp(140px, 38vw, 200px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  background-color:var(--seam);
  background-image:
    linear-gradient(90deg, var(--seam) 0 2px, transparent 2px 158px, var(--seam) 158px),
    linear-gradient(0deg, var(--seam) 0 2px, transparent 2px 158px, var(--seam) 158px),
    radial-gradient(circle at 50% 50%, #fff 0, #fefefd 36%, #f1f1ee 76%, #e9e9e5 100%);
  background-size:160px 160px;background-attachment:fixed;background-position:center top}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 95% 85% at 50% 40%, transparent 55%, rgba(70,70,62,.10) 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.textbtn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:10px 6px;transition:color .2s}
.textbtn:hover,.textbtn:focus-visible{color:var(--ink);outline:none}
.textbtn.danger:hover{color:#b23b2e}
[hidden]{display:none !important}

/* barre du haut */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:flex-end;align-items:center;gap:18px;
  padding:14px clamp(16px,4vw,32px);
  background:linear-gradient(rgba(240,240,237,.85), rgba(240,240,237,0));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.count{margin-right:auto;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}

/* le mur */
.wall{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill, minmax(var(--W), 1fr));
  gap:clamp(36px,5vw,60px) clamp(22px,4vw,48px);justify-items:center;
  padding:96px clamp(18px,6vw,96px) 120px;max-width:1500px;margin:0 auto}
.paper{position:relative;width:var(--W);aspect-ratio:3/4;background:#fff;cursor:zoom-in;
  display:flex;align-items:center;justify-content:center;padding:30px 20px 22px;
  transform:translate(var(--x),var(--y)) rotate(var(--r));transform-origin:50% 6px;
  box-shadow:0 1px 1px rgba(0,0,0,.05), 0 16px 26px -14px rgba(0,0,0,.30), 0 0 0 1px rgba(0,0,0,.03);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s}
.paper:hover{transform:translate(var(--x),calc(var(--y) - 3px)) rotate(calc(var(--r) * .4));
  box-shadow:0 1px 1px rgba(0,0,0,.05), 0 24px 34px -16px rgba(0,0,0,.34), 0 0 0 1px rgba(0,0,0,.03)}
.paper p{font:400 19px/1.3 'Instrument Serif',serif;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;
  max-height:100%;overflow:hidden}
.paper.sm p{font-size:16px}
.paper.xs p{font-size:13.5px}
.pin{position:absolute;top:-8px;left:50%;width:17px;height:17px;margin-left:-8.5px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 34% 30%, #ffb3a3 0, #ef6a50 22%, var(--pin) 48%, #7e1d10 100%);
  box-shadow:0 2px 2px rgba(0,0,0,.25), 3px 7px 8px rgba(0,0,0,.18)}
.pin::after{content:"";position:absolute;left:4px;top:3px;width:5px;height:3px;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(.4px)}
.empty{position:fixed;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none;
  font:italic 400 24px 'Instrument Serif',serif;color:var(--mute)}

/* lecture d'un papier */
.focus{position:fixed;inset:0;z-index:20;display:grid;place-items:center;visibility:hidden}
.focus.on{visibility:visible}
.veil{position:absolute;inset:0;background:rgba(246,246,243,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .35s}
.focus.on .veil{opacity:1}
.big{position:relative;width:min(400px, 84vw);aspect-ratio:3/4;background:#fff;
  display:flex;align-items:center;justify-content:center;padding:52px 40px;
  box-shadow:0 50px 80px -40px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04);
  opacity:0;transform:translateY(14px) scale(.97);transition:opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1)}
.focus.on .big{opacity:1;transform:none}
.big .pin{top:-9px;width:20px;height:20px;margin-left:-10px}
.big p{font:400 28px/1.3 'Instrument Serif',serif;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;max-height:100%;overflow:auto;user-select:text}
.big.sm p{font-size:23px}
.big.xs p{font-size:19px}
.fbar{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:20px;
  opacity:0;transition:opacity .35s}
.focus.on .fbar{opacity:1}
.fcount{font-size:11px;letter-spacing:.14em;color:var(--mute);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

/* connexion */
.login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:rgba(246,246,243,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.login form{display:flex;flex-direction:column;align-items:center;gap:14px}
.login input{width:220px;border:0;border-bottom:1px solid #c9c8c3;background:transparent;outline:0;padding:10px 4px;
  font:15px Inter,system-ui,sans-serif;letter-spacing:.12em;text-align:center;color:var(--ink)}
.login input::placeholder{color:#b9b8b3;letter-spacing:.2em;text-transform:uppercase;font-size:11px}
.login input:focus{border-bottom-color:var(--ink)}
.caption{position:fixed;left:0;right:0;bottom:28px;text-align:center;z-index:40;pointer-events:none;
  font:italic 400 18px 'Instrument Serif',serif;color:#6f6e69;opacity:0;transition:opacity .4s}
.caption.on{opacity:1}
@media (prefers-reduced-motion:reduce){ .paper,.big,.veil{transition:none} }
</style>
</head>
<body>

<div class="bar" id="bar" hidden>
  <span class="count" id="count"></span>
  <button class="textbtn danger" id="clearBtn">Tout décrocher</button>
  <button class="textbtn" id="outBtn">Quitter</button>
</div>

<main class="wall" id="wall"></main>
<div class="empty" id="empty" hidden>Le mur est vide.</div>

<div class="focus" id="focus">
  <div class="veil" id="veil"></div>
  <div class="big" id="big"><span class="pin"></span><p id="bigText"></p></div>
  <div class="fbar">
    <button class="textbtn" id="prevBtn" aria-label="Papier précédent">←</button>
    <span class="fcount" id="fcount"></span>
    <button class="textbtn" id="nextBtn" aria-label="Papier suivant">→</button>
    <button class="textbtn danger" id="removeBtn">Décrocher</button>
    <button class="textbtn" id="closeBtn">Fermer</button>
  </div>
</div>

<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="off">
    <input id="codeIn" type="password" placeholder="code" aria-label="Code" autocomplete="current-password">
  </form>
</div>

<div class="caption" id="caption"></div>

<script>
(() => {
  const SUPABASE_URL = 'https://zurkvkbilehemrynvwwb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1cmt2a2JpbGVoZW1yeW52d3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTEzNzEsImV4cCI6MjExMDQ4NzM3MX0.DWvG8jqvvPJTfTcwKpIS1g0BenqECiK9A9UoKHwylVM';
  const $ = id => document.getElementById(id);
  const wall = $('wall'), bar = $('bar'), login = $('login'), codeIn = $('codeIn');
  const focus = $('focus'), big = $('big'), bigText = $('bigText');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(){ try { return localStorage.getItem('sp-admin') || ''; } catch (e) { return ''; } },
    set(v){ try { v ? localStorage.setItem('sp-admin', v) : localStorage.removeItem('sp-admin'); } catch (e) {} }
  };
  let code = store.get();
  let papers = [];            // [{id, text}]
  const els = new Map();      // id -> élément
  let current = -1, pollT = null, busy = false;

  async function rpc(fn, body){
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: 'POST', signal: ctrl.signal,
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('http ' + res.status);
      return await res.json();
    } finally { clearTimeout(t); }
  }

  let capT;
  function say(t, ms = 2600){
    clearTimeout(capT);
    $('caption').textContent = t;
    $('caption').classList.add('on');
    capT = setTimeout(() => $('caption').classList.remove('on'), ms);
  }

  // position stable de chaque papier (dérivée de son id)
  function seed(id){ let h = 2166136261; for (const c of id) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
  const sizeClass = t => t.length > 220 ? 'xs' : t.length > 110 ? 'sm' : '';

  function makePaper(p){
    const r = seed(p.id);
    const el = document.createElement('div');
    el.className = 'paper ' + sizeClass(p.text);
    el.style.setProperty('--r', (r() * 7 - 3.5).toFixed(2) + 'deg');
    el.style.setProperty('--x', (r() * 16 - 8).toFixed(1) + 'px');
    el.style.setProperty('--y', (r() * 14 - 7).toFixed(1) + 'px');
    const pin = document.createElement('span'); pin.className = 'pin';
    const t = document.createElement('p'); t.textContent = p.text;
    el.append(pin, t);
    el.tabIndex = 0;
    el.addEventListener('click', () => open(papers.findIndex(x => x.id === p.id)));
    el.addEventListener('keydown', e => { if (e.key === 'Enter') open(papers.findIndex(x => x.id === p.id)); });
    return el;
  }

  function render(list, animateNew){
    const ids = new Set(list.map(p => p.id));
    for (const [id, el] of els) if (!ids.has(id)) { el.remove(); els.delete(id); }
    let i = 0;
    list.forEach((p, k) => {
      let el = els.get(p.id);
      if (!el) {
        el = makePaper(p); els.set(p.id, el);
        if (animateNew && !reduce) el.animate([{ opacity: 0, translate: '0 -14px' }, { opacity: 1, translate: '0 0' }],
          { duration: 520, delay: Math.min(i++ * 45, 900), easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
      }
      if (wall.children[k] !== el) wall.insertBefore(el, wall.children[k] || null);
    });
    papers = list;
    const n = list.length;
    $('count').textContent = n === 0 ? '' : n === 1 ? '1 idée' : n + ' idées';
    $('empty').hidden = n !== 0;
    $('clearBtn').hidden = n === 0;
  }

  async function load(first){
    try {
      const data = await rpc('admin_ideas', { code });
      if (data === null) { logout(true); return false; }
      render(Array.isArray(data) ? data : [], true);
      return true;
    } catch (e) {
      if (first) say('Impossible de charger le mur pour l’instant.', 4000);
      return false;
    }
  }

  function startPolling(){
    clearInterval(pollT);
    pollT = setInterval(() => { if (!document.hidden && !focus.classList.contains('on')) load(false); }, 20000);
  }

  async function enter(c){
    code = c;
    const ok = await load(true);
    if (ok) { store.set(c); login.hidden = true; bar.hidden = false; startPolling(); }
    return ok;
  }

  function logout(wrong){
    clearInterval(pollT);
    code = ''; store.set('');
    els.forEach(el => el.remove()); els.clear(); papers = [];
    bar.hidden = true; $('empty').hidden = true; close();
    login.hidden = false; codeIn.value = '';
    setTimeout(() => codeIn.focus(), 50);
    if (wrong) shake();
  }
  function shake(){
    if (reduce) return;
    codeIn.animate([0, -6, 6, -4, 4, 0].map(x => ({ transform: `translateX(${x}px)` })), { duration: 380 });
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const c = codeIn.value.trim();
    if (!c || busy) return;
    busy = true;
    const ok = await enter(c);
    busy = false;
    if (!ok && !login.hidden) { shake(); codeIn.select(); }
  });

  // lecture
  function show(){
    const p = papers[current]; if (!p) return close();
    big.className = 'big ' + sizeClass(p.text);
    bigText.textContent = p.text;
    $('fcount').textContent = `${current + 1} / ${papers.length}`;
    $('prevBtn').disabled = current <= 0;
    $('nextBtn').disabled = current >= papers.length - 1;
    resetRemove();
  }
  function open(i){ if (i < 0) return; current = i; show(); focus.classList.add('on'); }
  function close(){ focus.classList.remove('on'); current = -1; resetRemove(); }
  function step(d){ const j = current + d; if (j < 0 || j >= papers.length) return; current = j; show(); }

  let armed = false, armT;
  function resetRemove(){ armed = false; clearTimeout(armT); $('removeBtn').textContent = 'Décrocher'; }
  $('removeBtn').addEventListener('click', async () => {
    if (busy) return;
    if (!armed) { armed = true; $('removeBtn').textContent = 'Sûr ? Décrocher'; armT = setTimeout(resetRemove, 4000); return; }
    const p = papers[current]; if (!p) return;
    busy = true;
    try {
      const ok = await rpc('admin_remove_idea', { code, idea: p.id });
      if (!ok) { busy = false; logout(true); return; }
    } catch (e) { busy = false; say('Impossible de décrocher ce papier pour l’instant.', 3500); return; }
    const el = els.get(p.id);
    const list = papers.filter(x => x.id !== p.id);
    if (list.length === 0) close(); else { current = Math.min(current, list.length - 1); }
    if (el && !reduce) await el.animate([{ opacity: 1 }, { opacity: 0, translate: '0 30px', rotate: '8deg' }], { duration: 380, easing: 'ease-in' }).finished.catch(() => {});
    render(list, false);
    if (current >= 0) show();
    busy = false;
  });

  let armedAll = false, armAllT;
  $('clearBtn').addEventListener('click', async () => {
    if (busy) return;
    if (!armedAll) { armedAll = true; $('clearBtn').textContent = 'Sûr ? Tout décrocher'; armAllT = setTimeout(() => { armedAll = false; $('clearBtn').textContent = 'Tout décrocher'; }, 4000); return; }
    armedAll = false; clearTimeout(armAllT); $('clearBtn').textContent = 'Tout décrocher';
    busy = true;
    try {
      const ok = await rpc('clear_ideas', { code });
      if (!ok) { busy = false; logout(true); return; }
    } catch (e) { busy = false; say('Impossible de tout décrocher pour l’instant.', 3500); return; }
    if (!reduce) await Promise.all([...els.values()].map((el, i) =>
      el.animate([{ opacity: 1 }, { opacity: 0, translate: '0 60px', rotate: ((i % 2 ? 1 : -1) * 10) + 'deg' }],
        { duration: 450, delay: Math.min(i * 30, 600), easing: 'ease-in', fill: 'forwards' }).finished.catch(() => {})));
    render([], false);
    busy = false;
  });

  $('outBtn').addEventListener('click', () => logout(false));
  $('closeBtn').addEventListener('click', close);
  $('veil').addEventListener('click', close);
  $('prevBtn').addEventListener('click', () => step(-1));
  $('nextBtn').addEventListener('click', () => step(1));
  addEventListener('keydown', e => {
    if (!focus.classList.contains('on')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && code && login.hidden) load(false); });

  // démarrage
  if (code) { enter(code).then(ok => { if (!ok && login.hidden) logout(false); }); }
  else logout(false);
})();
</script>
</body>
</html>
