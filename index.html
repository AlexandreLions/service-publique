<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Publique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1c1a;
  --mute:#a3a29d;
  --s:1;
  --W:min(340px, 78vw);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#f7f7f5;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- la pièce ---------- */
:root{
  --seam:#e1e1dd;
  --grid:
    linear-gradient(90deg, var(--seam) 0 2px, transparent 2px 158px, var(--seam) 158px),
    linear-gradient(0deg, var(--seam) 0 2px, transparent 2px 158px, var(--seam) 158px),
    radial-gradient(circle at 50% 50%, #fff 0, #fefefd 36%, #f1f1ee 76%, #e9e9e5 100%);
}
body{background:#efefec}
.wall{position:absolute;backface-visibility:hidden;pointer-events:none;
  background-color:var(--seam);background-image:var(--grid);background-size:160px 160px;background-position:0 100%}
.wall::after{content:"";position:absolute;inset:0}
.wall.back{left:-960px;top:-1600px;width:1920px;height:1600px;transform:translateZ(-500px)}
.wall.back::after{background:
  linear-gradient(90deg, rgba(0,0,0,.05), transparent 7%, transparent 93%, rgba(0,0,0,.05)),
  linear-gradient(0deg, rgba(0,0,0,.035), transparent 10%)}
.wall.refl{left:-960px;top:0;width:1920px;height:1400px;transform:translateZ(-500px);background-position:0 0}
.wall.side-l,.wall.side-r{left:-560px;top:-1900px;width:1120px;height:1900px}
.wall.side-l{transform:translateX(-960px) translateZ(60px) rotateY(90deg)}
.wall.side-r{transform:translateX(960px) translateZ(60px) rotateY(-90deg)}
.wall.side-l::after{background:linear-gradient(270deg, rgba(0,0,0,.07), rgba(0,0,0,.015) 45%, transparent)}
.wall.side-r::after{background:linear-gradient(90deg, rgba(0,0,0,.07), rgba(0,0,0,.015) 45%, transparent)}
.glow{position:absolute;width:176px;height:176px;margin:-8px;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%, #fff 0, rgba(255,255,255,.96) 42%, rgba(255,255,255,0) 71%)}
@keyframes breathe{0%,100%{opacity:0}50%{opacity:.8}}
.floor{position:absolute;left:-960px;top:-560px;width:1920px;height:1120px;pointer-events:none;
  transform:translateZ(60px) rotateX(90deg);
  background:
    linear-gradient(90deg, rgba(0,0,0,.035) 0 2px, transparent 2px) 0 0/320px 320px,
    linear-gradient(0deg, rgba(0,0,0,.035) 0 2px, transparent 2px) 0 0/320px 320px,
    linear-gradient(180deg, rgba(244,244,241,.74) 0%, rgba(240,240,236,.9) 28%, rgba(235,235,231,.98) 70%, #eaeae6 100%)}
.cove{position:absolute;left:-960px;top:-5px;width:1920px;height:5px;transform:translateZ(-499px);pointer-events:none;
  background:#fff;box-shadow:0 0 22px 7px rgba(255,255,255,.95), 0 0 70px 24px rgba(255,255,255,.7)}
.boxrefl{position:absolute;left:-120px;top:0;width:240px;height:90px;transform:translateZ(100px) translateY(calc(var(--lift) * 1px));pointer-events:none;
  background:linear-gradient(180deg, rgba(205,204,199,.34), rgba(236,236,232,0) 85%)}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 90% 80% at 50% 42%, transparent 50%, rgba(70,70,62,.11) 100%)}

.stage{position:absolute;left:50%;top:74%;width:0;height:0;
  perspective:1100px;perspective-origin:-240px -430px;
  transform:scale(var(--s));z-index:1}

/* ombre au sol */
.floorshade{position:absolute;transform:rotateX(90deg);filter:blur(12px);pointer-events:none}

.floorshade.pile-sh{left:160px;top:-110px;width:190px;height:220px;transform:translateZ(60px) rotateX(90deg);
  background:radial-gradient(closest-side, rgba(0,0,0,.12), transparent)}

/* ---------- la boîte ---------- */
@property --lift{syntax:'<number>';inherits:true;initial-value:22}
@keyframes float{0%,100%{--lift:18}50%{--lift:27}}
.stage{animation:float 6s ease-in-out infinite}
.boxwrap{position:absolute;left:0;top:0;transform-style:preserve-3d}
.box{position:absolute;left:-120px;top:-200px;width:240px;height:200px;transform-style:preserve-3d;
  transform:translateY(calc(var(--lift) * -1px))}
.face{position:absolute;backface-visibility:hidden}
.front{left:0;top:0;width:240px;height:200px;transform:translateZ(100px);overflow:hidden;
  background:linear-gradient(180deg,#f3f3f1 0%,#e9e8e4 60%,#dfded9 100%);
  box-shadow:inset 0 1.5px 0 #fff, inset 1px 0 0 rgba(255,255,255,.8), inset -1px 0 0 rgba(0,0,0,.04),
    inset 0 -1.5px 0 rgba(255,255,255,.95), inset 0 -40px 50px -40px rgba(255,255,255,.9)}
.front::before{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 38%, rgba(255,255,255,.75) 49%, rgba(255,255,255,0) 60%) no-repeat;
  background-size:260% 100%;animation:sheen 11s cubic-bezier(.6,0,.3,1) infinite}
@keyframes sheen{0%,72%{background-position:130% 0}100%{background-position:-30% 0}}
.top{left:0;top:0;width:240px;height:200px;transform:rotateX(90deg) translateZ(100px);
  background:radial-gradient(ellipse 90% 80% at 50% 60%, #fff 0%, #fbfbfa 60%, #f1f1ee 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9);
  display:grid;place-items:center}
.side{top:0;width:200px;height:200px;left:20px;background:#e6e5e1}
.side.l{background:linear-gradient(90deg,#d6d5d0,#e2e1dd 70%,#e9e8e4);box-shadow:inset -1.5px 0 0 rgba(255,255,255,.95), inset 0 1.5px 0 rgba(255,255,255,.8)}
.side.l{transform:rotateY(-90deg) translateZ(120px)}
.side.r{transform:rotateY(90deg) translateZ(120px)}
.slot{position:relative;width:150px;height:18px;border-radius:9px;
  background:linear-gradient(180deg,#0e0e0d,#2c2b29 70%,#3d3c39);
  box-shadow:inset 0 4px 5px rgba(0,0,0,.75), 0 1.5px 0 #fff, 0 -1px 0 rgba(0,0,0,.06)}
.slotlight{position:absolute;inset:3px 6px;border-radius:6px;background:#fff;opacity:0;
  box-shadow:0 0 18px 7px rgba(255,255,255,.95), 0 0 50px 20px rgba(255,255,255,.6)}
.floorshade.pool{left:-210px;top:-180px;width:420px;height:360px;filter:blur(8px);
  background:radial-gradient(closest-side, #fff 0%, rgba(255,255,255,.85) 45%, rgba(255,255,255,0));
  opacity:calc(var(--lift) / 38)}
.floorshade.box-sh{left:-140px;top:-120px;width:280px;height:240px;filter:blur(14px);
  background:radial-gradient(closest-side, rgba(0,0,0,.3), rgba(0,0,0,.1) 60%, transparent);
  transform:rotateX(90deg) scale(calc(1.14 - var(--lift) * .007));opacity:calc(1.35 - var(--lift) / 40)}
@media (prefers-reduced-motion:reduce){ .stage{animation:none} .front::before{animation:none} }

/* ---------- la pile de feuilles ---------- */
.pile{position:absolute;left:0;top:0;transform-style:preserve-3d;transform:translate3d(250px,0,60px);cursor:pointer}
.ps{position:absolute;left:-62px;top:-82px;width:124px;height:164px;background:#fff;
  transform:translateY(calc(var(--i) * -2.4px)) rotateX(90deg) rotateZ(var(--r));
  box-shadow:0 0 0 1px rgba(0,0,0,.07);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .2s}
.ps:nth-child(-n+4){background:#fbfbfa}
.pile:hover .ps:last-child{transform:translateY(calc(var(--i) * -2.4px - 12px)) rotateX(90deg) rotateZ(calc(var(--r) - 3deg))}
.pile.taken .ps:last-child{opacity:0}
.hint{position:absolute;left:250px;top:96px;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}

/* ---------- interface ---------- */
.title{position:fixed;left:32px;top:28px;z-index:2}
.title h1{font:400 26px/1 'Instrument Serif',serif;letter-spacing:-.01em}
.title p{margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mode{position:fixed;right:28px;top:30px;font-size:11px;color:var(--mute);z-index:2}
.textbtn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8d8c87;padding:10px 6px;transition:color .2s}
.textbtn:hover,.textbtn:focus-visible{color:var(--ink);outline:none}
.textbtn:disabled{opacity:.35;cursor:default}
.bottom{position:fixed;left:0;right:0;bottom:30px;display:flex;justify-content:center;z-index:2;transition:opacity .4s}
.caption{position:fixed;left:0;right:0;bottom:84px;text-align:center;z-index:30;
  font:italic 400 19px/1.3 'Instrument Serif',serif;color:#6f6e69;opacity:0;transition:opacity .5s;pointer-events:none;padding:0 24px}
.caption.on{opacity:1}

/* ---------- le bureau (écrire) ---------- */
.veil{position:fixed;inset:0;background:rgba(249,249,247,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .5s}
.desk{position:fixed;inset:0;z-index:10;display:grid;place-items:center;pointer-events:none;visibility:hidden}
.desk.on{pointer-events:auto;visibility:visible}
.desk.on .veil{opacity:1}
.desk.sending .veil{opacity:0}
.sheetwrap{position:relative;margin-top:-4vh}
.sheet{position:relative;width:var(--W);aspect-ratio:3/4;background:#fff;
  box-shadow:0 40px 70px -30px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.035);will-change:transform}
.sheet textarea{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;
  padding:46px 38px;font:400 25px/1.32 'Instrument Serif',serif;color:var(--ink);user-select:text;-webkit-user-select:text}
.sheet textarea::placeholder{color:#c9c8c3;font-style:italic}
.actions{position:absolute;top:calc(100% + 18px);left:-6px;right:-6px;display:flex;justify-content:space-between;transition:opacity .3s}
.desk.sending .actions{opacity:0}

/* ---------- la lecture (vider) ---------- */
.reader{position:fixed;inset:0;z-index:20;pointer-events:none;visibility:hidden}
.reader.on{pointer-events:auto;visibility:visible}
.reader.lit .veil{opacity:1}
.rstack{position:fixed;inset:0}
.rsheet{position:fixed;width:var(--W);height:calc(var(--W) * 4 / 3);
  left:calc(50% - var(--W) / 2);top:calc(47% - var(--W) * 2 / 3);
  background:#fff;box-shadow:0 30px 60px -32px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.04);
  display:flex;align-items:center;justify-content:center;padding:44px 36px;cursor:pointer;will-change:transform}
.rsheet p{font:400 25px/1.32 'Instrument Serif',serif;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;max-height:100%;overflow:hidden}
.rsheet.sm p{font-size:20px}
.rsheet.xs p{font-size:16.5px}
.done{position:fixed;left:0;right:0;top:47%;transform:translateY(-50%);text-align:center;
  font:italic 400 24px 'Instrument Serif',serif;color:#8d8c87;opacity:0;transition:opacity .4s;pointer-events:none}
.done.on{opacity:1}
.rbar{position:fixed;left:0;right:0;bottom:26px;display:flex;justify-content:center;align-items:center;gap:22px;opacity:0;transition:opacity .4s;pointer-events:none}
.reader.ready .rbar{opacity:1;pointer-events:auto}
.count{font-size:11px;letter-spacing:.14em;color:var(--mute);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.danger:hover{color:#b23b2e}
.code{width:110px;border:0;border-bottom:1px solid #cfcec9;background:transparent;outline:0;padding:6px 2px;
  font:12px Inter,system-ui,sans-serif;letter-spacing:.1em;color:var(--ink);text-align:center}

@media (max-width:560px){
  .title{left:20px;top:20px}
  .mode{right:16px;top:auto;bottom:8px;left:0;text-align:center}
  .rbar{gap:10px;flex-wrap:wrap;padding:0 12px}
}
@media (prefers-reduced-motion:reduce){ .ps{transition:none} }
</style>
</head>
<body>



<div class="stage" id="stage">
  <div class="wall back" id="backwall"></div>
  <div class="wall refl"></div>
  <div class="wall side-l"></div>
  <div class="wall side-r"></div>
  <div class="floor"></div>
  <div class="cove"></div>
  <div class="boxrefl"></div>
  <div class="floorshade pool"></div>
  <div class="floorshade box-sh"></div>
  <div class="floorshade pile-sh"></div>

  <div class="boxwrap" id="boxwrap">
    <div class="box">
      <div class="face side l"></div>
      <div class="face side r"></div>
      <div class="face top"><div class="slot" id="slot"><div class="slotlight" id="slotlight"></div></div></div>
      <div class="face front"></div>
    </div>
  </div>

  <div class="pile" id="pile" role="button" tabindex="0" aria-label="Prendre une feuille">
    <div class="ps" style="--i:0;--r:4deg"></div>
    <div class="ps" style="--i:1;--r:-3deg"></div>
    <div class="ps" style="--i:2;--r:1.5deg"></div>
    <div class="ps" style="--i:3;--r:-5deg"></div>
    <div class="ps" style="--i:4;--r:2.5deg"></div>
    <div class="ps" style="--i:5;--r:-1deg"></div>
    <div class="ps" style="--i:6;--r:3.5deg"></div>
    <div class="ps" style="--i:7;--r:-2deg"></div>
    <div class="ps" style="--i:8;--r:.5deg"></div>
  </div>
</div>
<div class="vignette"></div>

<div class="bottom" id="bottom">
  <button class="textbtn" id="emptyBtn">Vider</button>
</div>

<div class="caption" id="caption"></div>

<!-- écrire -->
<div class="desk" id="desk">
  <div class="veil" id="deskVeil"></div>
  <div class="sheetwrap">
    <div class="sheet" id="sheet">
      <textarea id="idea" maxlength="400" placeholder="Une idée…" aria-label="Ton idée"></textarea>
    </div>
    <div class="actions">
      <button class="textbtn" id="cancelBtn">Reposer</button>
      <button class="textbtn" id="sendBtn">Glisser dans la boîte ↵</button>
    </div>
  </div>
</div>

<!-- lire -->
<div class="reader" id="reader">
  <div class="veil"></div>
  <div class="rstack" id="rstack"></div>
  <div class="done" id="done">C’est tout.</div>
  <div class="rbar">
    <button class="textbtn" id="prevBtn" aria-label="Idée précédente">←</button>
    <span class="count" id="count"></span>
    <button class="textbtn" id="nextBtn" aria-label="Idée suivante">→</button>
    <button class="textbtn" id="backBtn">Remettre dans la boîte</button>
    <button class="textbtn danger" id="trashBtn" hidden>Tout jeter</button>
    <input id="codeIn" class="code" type="password" placeholder="code" hidden autocomplete="off">
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const slot = $('slot'), boxwrap = $('boxwrap'), pile = $('pile');
  const desk = $('desk'), sheet = $('sheet'), ta = $('idea');
  const reader = $('reader'), rstack = $('rstack'), count = $('count'), done = $('done');
  const caption = $('caption'), bottom = $('bottom');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = ms => reduce ? Math.round(ms * 0.35) : ms;

  /* ---------- mise à l'échelle ---------- */
  function fit(){
    const s = Math.min(1, (innerWidth - 20) / 700, innerHeight / 640);
    document.documentElement.style.setProperty('--s', s.toFixed(3));
    document.getElementById('stage').style.marginLeft = innerWidth < 760 ? (-85 * s).toFixed(1) + 'px' : '0px';
  }
  fit(); addEventListener('resize', fit);

  /* ---------- murs de lumière ---------- */
  const glows = [];
  (() => {
    const wall = $('backwall'), COLS = 12, ROWS = 10, H = 1600, frag = document.createDocumentFragment();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const g = document.createElement('div');
      g.className = 'glow';
      const x = c * 160, y = H - (r + 1) * 160;
      g.style.left = x + 'px'; g.style.top = y + 'px';
      g._d = Math.hypot(x + 80 - 960, (r * 160 + 80) * 1.15);
      glows.push(g); frag.appendChild(g);
    }
    wall.appendChild(frag);
    if (!reduce) {
      const lower = glows.filter((_, i) => i < COLS * 6);
      for (let i = 0; i < 9; i++) {
        const g = lower.splice(Math.floor(Math.random() * lower.length), 1)[0];
        const d = 9 + Math.random() * 9;
        g.style.animation = `breathe ${d.toFixed(1)}s ease-in-out ${(-Math.random() * d).toFixed(1)}s infinite`;
      }
    }
  })();
  function wave(strength = .95){
    if (reduce) return;
    glows.forEach(g => g.animate(
      [{ opacity: 0 }, { opacity: strength, offset: .28 }, { opacity: 0 }],
      { duration: 1500, delay: g._d * 0.75, easing: 'ease-out' }));
  }

  /* ---------- stockage partagé : Supabase ---------- */
  const SUPABASE_URL = 'https://zurkvkbilehemrynvwwb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1cmt2a2JpbGVoZW1yeW52d3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTEzNzEsImV4cCI6MjExMDQ4NzM3MX0.DWvG8jqvvPJTfTcwKpIS1g0BenqECiK9A9UoKHwylVM';
  const online = /^https:\/\//.test(SUPABASE_URL) && !SUPABASE_KEY.startsWith('__');
  const admin = location.hash === '#admin';
  let local = [];
  $('trashBtn').hidden = !admin;

  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function api(path, opts = {}){
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, {
        signal: ctrl.signal,
        headers: Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, opts.headers || {})
      }));
      if (!res.ok) { const e = new Error('http ' + res.status); e.status = res.status; throw e; }
      return res.status === 204 ? null : res.json().catch(() => null);
    } finally { clearTimeout(t); }
  }
  const store = {
    async add(text){
      if (!online) { local.push({ id: String(Math.random()), text }); return; }
      const body = JSON.stringify({ text });
      try { await api('/rest/v1/ideas', { method: 'POST', body, headers: { Prefer: 'return=minimal' } }); }
      catch (e) { if (e.status && e.status < 500) throw e; await wait(500 + Math.random() * 700); await api('/rest/v1/ideas', { method: 'POST', body, headers: { Prefer: 'return=minimal' } }); }
    },
    async all(){
      if (!online) return local.slice();
      const rows = await api('/rest/v1/ideas?select=text&limit=2000');
      return (rows || []).map((r, i) => ({ id: i, text: String(r.text || '') })).filter(x => x.text.trim());
    },
    async clear(code){
      if (!online) { local = []; return; }
      const ok = await api('/rest/v1/rpc/clear_ideas', { method: 'POST', body: JSON.stringify({ code }) });
      if (ok !== true) { const e = new Error('code'); e.code = 'bad_code'; throw e; }
    }
  };
  const errMsg = e => (e && e.status === 400) ? 'Cette idée est trop longue.' : 'L’idée n’a pas pu partir. Réessaie.';

  /* ---------- outils ---------- */
  let capT;
  function say(t, ms = 2600){
    clearTimeout(capT);
    caption.textContent = t || '';
    caption.classList.toggle('on', !!t);
    if (t) capT = setTimeout(() => caption.classList.remove('on'), ms);
  }
  function anim(el, frames, opts){
    const a = el.animate(frames, Object.assign({ fill: 'forwards' }, opts, { duration: T(opts.duration || 400), delay: T(opts.delay || 0) }));
    return a.finished.catch(() => {});
  }
  function settle(el, transform){
    el.getAnimations().forEach(a => a.cancel());
    el.style.transform = transform || '';
    el.style.clipPath = '';
  }
  // géométrie : où placer une feuille pour qu'elle soit juste au-dessus de la fente
  function slotGeom(el){
    const s = slot.getBoundingClientRect();
    const prev = el.style.transform; el.style.transform = 'none';
    const r = el.getBoundingClientRect();
    el.style.transform = prev;
    const k = (s.width * 0.84) / r.width, hk = r.height * k;
    const dx = s.left + s.width / 2 - (r.left + r.width / 2);
    const dy = s.top + s.height / 2 - hk / 2 - (r.top + r.height / 2); // bord bas sur la fente
    return { k, hk, above: `translate(${dx}px,${dy}px) scale(${k})`, inside: `translate(${dx}px,${dy + hk}px) scale(${k})` };
  }
  const thump = () => anim(boxwrap, [{ transform: 'translateY(0)' }, { transform: 'translateY(2.5px)' }, { transform: 'translateY(0)' }], { duration: 280, easing: 'ease-out', fill: 'none' });
  const flash = (peak = 1, d = 900) => anim($('slotlight'), [{ opacity: 0 }, { opacity: peak, offset: .25 }, { opacity: 0 }], { duration: d, easing: 'ease-out', fill: 'none' });
  const shake = () => anim(boxwrap, [0, -5, 5, -3, 3, 0].map(x => ({ transform: `translateX(${x}px)` })), { duration: 420, fill: 'none' });

  let busy = false;

  /* ---------- écrire ---------- */
  function topPileSheet(){ return pile.lastElementChild; }

  async function openDesk(){
    if (busy || desk.classList.contains('on') || reader.classList.contains('on')) return;
    busy = true;
    ta.value = '';
    settle(sheet);
    const from = topPileSheet().getBoundingClientRect();
    desk.classList.remove('sending');
    desk.classList.add('on');
    pile.classList.add('taken');
    bottom.style.opacity = 0;
    const to = sheet.getBoundingClientRect();
    const dx = from.left + from.width / 2 - (to.left + to.width / 2);
    const dy = from.top + from.height / 2 - (to.top + to.height / 2);
    const k = from.width / to.width;
    await anim(sheet, [
      { transform: `translate(${dx}px,${dy}px) scale(${k}) perspective(900px) rotateX(62deg)`, opacity: .5 },
      { transform: 'none', opacity: 1 }
    ], { duration: 560, easing: 'cubic-bezier(.2,.8,.2,1)' });
    settle(sheet);
    busy = false;
    ta.focus({ preventScroll: true });
  }

  async function putDown(){
    if (busy || !desk.classList.contains('on')) return;
    busy = true;
    ta.blur();
    const to = topPileSheet().getBoundingClientRect();
    const r = sheet.getBoundingClientRect();
    const dx = to.left + to.width / 2 - (r.left + r.width / 2);
    const dy = to.top + to.height / 2 - (r.top + r.height / 2);
    desk.classList.add('sending');
    await anim(sheet, [
      { transform: 'none', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) scale(${to.width / r.width}) perspective(900px) rotateX(62deg)`, opacity: .5 }
    ], { duration: 460, easing: 'cubic-bezier(.4,0,.2,1)' });
    closeDesk();
    busy = false;
  }

  function closeDesk(){
    desk.classList.remove('on', 'sending');
    pile.classList.remove('taken');
    bottom.style.opacity = '';
    settle(sheet);
  }

  async function send(){
    const text = ta.value.trim();
    if (busy || !desk.classList.contains('on')) return;
    if (!text) { ta.focus(); anim(sheet, [0, -4, 4, -2, 0].map(x => ({ transform: `translateX(${x}px)` })), { duration: 320, fill: 'none' }); return; }
    busy = true;
    ta.blur();
    desk.classList.add('sending');
    const g = slotGeom(sheet);
    const writing = store.add(text).then(() => null, e => e || { code: 'unknown' });
    await anim(sheet, [{ transform: 'none' }, { transform: g.above }], { duration: 780, easing: 'cubic-bezier(.55,0,.2,1)' });
    const err = await writing;
    if (err) {
      await anim(sheet, [{ transform: g.above }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });
      settle(sheet);
      desk.classList.remove('sending');
      say(errMsg(err), 4200);
      busy = false;
      return;
    }
    await anim(sheet, [
      { transform: g.above, clipPath: 'inset(0 0 0% 0)' },
      { transform: g.inside, clipPath: 'inset(0 0 100% 0)' }
    ], { duration: 560, easing: 'cubic-bezier(.45,0,.7,.2)' });
    thump();
    flash();
    wave();
    closeDesk();
    busy = false;
  }

  pile.addEventListener('click', openDesk);
  pile.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDesk(); } });
  $('sendBtn').addEventListener('click', send);
  $('cancelBtn').addEventListener('click', putDown);
  $('deskVeil').addEventListener('click', putDown);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    if (e.key === 'Escape') { e.preventDefault(); putDown(); }
  });

  /* ---------- vider / lire ---------- */
  const MAXSTACK = 7;
  let ideas = [], idx = 0, stack = []; // stack[0] = feuille du dessus

  function makeSheet(text){
    const el = document.createElement('div');
    el.className = 'rsheet';
    if (text.length > 260) el.classList.add('xs'); else if (text.length > 140) el.classList.add('sm');
    const p = document.createElement('p'); p.textContent = text; el.appendChild(p);
    const r = (Math.random() * 7 - 3.5).toFixed(2), x = (Math.random() * 12 - 6).toFixed(1), y = (Math.random() * 10 - 5).toFixed(1);
    el._rest = `translate(${x}px,${y}px) rotate(${r}deg)`;
    return el;
  }
  function refresh(){
    stack.forEach((el, i) => { el.style.zIndex = 100 - i; });
    const n = ideas.length;
    count.textContent = idx < n ? `${idx + 1} / ${n}` : `${n} / ${n}`;
    done.classList.toggle('on', idx >= n);
    $('prevBtn').disabled = idx <= 0;
    $('nextBtn').disabled = idx >= n;
  }
  function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  async function emptyBox(){
    if (busy || desk.classList.contains('on') || reader.classList.contains('on')) return;
    busy = true;
    $('emptyBtn').disabled = true;
    let items;
    try { items = await store.all(); }
    catch (e) { say('Impossible d’ouvrir la boîte pour l’instant.', 4000); busy = false; $('emptyBtn').disabled = false; return; }
    $('emptyBtn').disabled = false;
    if (!items.length) { shake(); busy = false; return; }

    ideas = shuffle(items); idx = 0;
    stack = ideas.slice(0, MAXSTACK).map(x => makeSheet(x.text));
    rstack.innerHTML = '';
    for (let i = stack.length - 1; i >= 0; i--) rstack.appendChild(stack[i]);
    reader.classList.remove('lit', 'ready');
    reader.classList.add('on');
    bottom.style.opacity = 0;
    refresh(); done.classList.remove('on');

    const last = stack.length - 1;
    const flights = stack.map((el, i) => {
      const g = slotGeom(el);
      el.style.transform = g.inside; el.style.clipPath = 'inset(0 0 100% 0)';
      const delay = (last - i) * 130; // le dessous sort en premier
      return (async () => {
        await anim(el, [
          { transform: g.inside, clipPath: 'inset(0 0 100% 0)' },
          { transform: g.above, clipPath: 'inset(0 0 0% 0)' }
        ], { duration: 430, delay, easing: 'cubic-bezier(.2,0,.3,1)' });
        el.style.clipPath = '';
        await anim(el, [{ transform: g.above }, { transform: el._rest }], { duration: 760, easing: 'cubic-bezier(.2,.8,.2,1)' });
        settle(el, el._rest);
      })();
    });
    flash(1, 1600);
    setTimeout(() => { thump(); wave(.7); }, T(80));
    setTimeout(() => reader.classList.add('lit'), T(last * 130 + 420));
    await Promise.all(flights);
    reader.classList.add('ready');
    busy = false;
  }

  function next(){
    if (busy || idx >= ideas.length) return;
    const el = stack.shift();
    const off = Math.min(innerWidth * 0.62, 560);
    anim(el, [{ transform: el._rest, opacity: 1 }, { transform: `translate(${-off}px,40px) rotate(-16deg)`, opacity: 0 }],
      { duration: 440, easing: 'cubic-bezier(.4,0,.2,1)' }).then(() => el.remove());
    idx++;
    const j = idx + stack.length;
    if (j < ideas.length) {
      const n = makeSheet(ideas[j].text);
      n.style.transform = n._rest;
      rstack.prepend(n); stack.push(n);
      anim(n, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, fill: 'none' });
    }
    refresh();
  }
  function prev(){
    if (busy || idx <= 0) return;
    idx--;
    const el = makeSheet(ideas[idx].text);
    el.style.transform = el._rest;
    rstack.appendChild(el); stack.unshift(el);
    const off = Math.min(innerWidth * 0.62, 560);
    anim(el, [{ transform: `translate(${-off}px,40px) rotate(-16deg)`, opacity: 0 }, { transform: el._rest, opacity: 1 }],
      { duration: 440, easing: 'cubic-bezier(.2,.8,.2,1)' }).then(() => settle(el, el._rest));
    if (stack.length > MAXSTACK) stack.pop().remove();
    refresh();
  }

  async function putBack(){
    if (busy || !reader.classList.contains('on')) return;
    busy = true;
    reader.classList.remove('ready', 'lit');
    done.classList.remove('on');
    await wait(T(200));
    const flights = stack.map((el, i) => {
      const g = slotGeom(el);
      return (async () => {
        await anim(el, [{ transform: el._rest }, { transform: g.above }], { duration: 620, delay: i * 110, easing: 'cubic-bezier(.55,0,.2,1)' });
        await anim(el, [
          { transform: g.above, clipPath: 'inset(0 0 0% 0)' },
          { transform: g.inside, clipPath: 'inset(0 0 100% 0)' }
        ], { duration: 380, easing: 'cubic-bezier(.45,0,.7,.2)' });
        el.remove();
      })();
    });
    await Promise.all(flights);
    if (flights.length) { thump(); flash(); }
    closeReader();
  }
  function closeReader(){
    reader.classList.remove('on', 'lit', 'ready');
    rstack.innerHTML = ''; stack = []; ideas = []; idx = 0;
    bottom.style.opacity = '';
    resetTrash();
    busy = false;
  }

  // jeter (code secret, seulement avec #admin)
  const trashBtn = $('trashBtn'), codeIn = $('codeIn');
  function resetTrash(){ codeIn.hidden = true; codeIn.value = ''; trashBtn.hidden = !admin; }
  trashBtn.addEventListener('click', () => { if (busy) return; trashBtn.hidden = true; codeIn.hidden = false; codeIn.focus(); });
  codeIn.addEventListener('keydown', async e => {
    e.stopPropagation();
    if (e.key === 'Escape') { resetTrash(); return; }
    if (e.key !== 'Enter' || busy) return;
    const code = codeIn.value; if (!code) return;
    busy = true;
    try { await store.clear(code); }
    catch (err) { say(err.code === 'bad_code' ? 'Mauvais code.' : 'Impossible de tout jeter pour l’instant.', 3000); codeIn.select(); busy = false; return; }
    resetTrash();
    reader.classList.remove('ready');
    await Promise.all(stack.map((el, i) => anim(el, [
      { transform: el._rest, opacity: 1 },
      { transform: `translate(${(Math.random() * 80 - 40).toFixed(0)}px,${innerHeight * 0.7}px) rotate(${(Math.random() * 40 - 20).toFixed(0)}deg)`, opacity: 0 }
    ], { duration: 650, delay: i * 50, easing: 'cubic-bezier(.5,0,.8,.4)' })));
    closeReader();
  });

  $('emptyBtn').addEventListener('click', emptyBox);
  $('nextBtn').addEventListener('click', next);
  $('prevBtn').addEventListener('click', prev);
  $('backBtn').addEventListener('click', putBack);
  rstack.addEventListener('click', e => { if (e.target.closest('.rsheet')) next(); });

  addEventListener('keydown', e => {
    if (!reader.classList.contains('on')) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'Escape') { e.preventDefault(); putBack(); }
  });
})();
</script>
</body>
</html>
