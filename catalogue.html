<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Publique — catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{ --ink:#1c1c1a; --mute:#8d8c87; --seam:#e1e1dd; --accent:#d4432c; --S:clamp(130px, 36vw, 210px); }
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  background-color:var(--seam);
  background-image:
    linear-gradient(90deg, var(--seam) 0 2px, transparent 2px 158px, var(--seam) 158px),
    linear-gradient(0deg, var(--seam) 0 2px, transparent 2px 158px, var(--seam) 158px),
    radial-gradient(circle at 50% 50%, #fff 0, #fefefd 36%, #f1f1ee 76%, #e9e9e5 100%);
  background-size:160px 160px;background-attachment:fixed;background-position:center top}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 95% 85% at 50% 40%, transparent 55%, rgba(70,70,62,.11) 100%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.textbtn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:10px 6px;text-decoration:none;transition:color .2s}
.textbtn:hover,.textbtn:focus-visible{color:var(--ink);outline:none}
[hidden]{display:none !important}

.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:18px;padding:14px clamp(16px,4vw,32px);
  background:linear-gradient(rgba(240,240,237,.9), rgba(240,240,237,0))}
.label{margin-left:auto;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* étagères */
.rack{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:120px clamp(18px,5vw,64px) 140px;display:flex;flex-direction:column;gap:clamp(70px,9vw,110px)}
.shelf{position:relative;display:flex;justify-content:center;gap:clamp(22px,4vw,56px);padding:0 clamp(10px,3vw,40px)}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:linear-gradient(#fdfdfc,#efefec);
  box-shadow:0 1px 0 rgba(0,0,0,.05), 0 18px 22px -14px rgba(0,0,0,.28), 0 -1px 0 #fff inset}

.rec{position:relative;width:var(--S);height:var(--S);cursor:pointer;outline:none}
.disc{position:absolute;top:4%;left:4%;width:92%;height:92%;border-radius:50%;
  background:
    radial-gradient(circle, var(--accent) 0 15%, #0e0e0f 15.5% 17%, transparent 17.5%),
    repeating-radial-gradient(circle, #121213 0 1.6px, #1b1b1d 1.6px 3.2px);
  box-shadow:0 0 0 1px #0a0a0a, 0 10px 18px -8px rgba(0,0,0,.4);
  transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.rec:hover,.rec:focus-visible{z-index:2}
.rec:hover .disc,.rec:focus-visible .disc{transform:translateX(34%) rotate(40deg)}
.sleeve{position:absolute;inset:0;background:#fbfbfa;overflow:hidden;transform-origin:50% 100%;transform:rotate(var(--lean,0deg));
  box-shadow:0 1px 1px rgba(0,0,0,.06), 0 22px 30px -18px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04);
  transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.rec:hover .sleeve,.rec:focus-visible .sleeve{transform:rotate(var(--lean,0deg)) translateY(-4px)}
.sleeve img{display:block;width:100%;height:100%;object-fit:cover}
.gen{position:absolute;inset:0;padding:12%;display:flex;flex-direction:column;justify-content:space-between}
.gen .t{font:400 clamp(17px,2.2vw,24px)/1.1 'Instrument Serif',serif;overflow-wrap:anywhere}
.gen .m{gap:6px;font-size:clamp(7px,1.7vw,9px);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.gen .dot{position:absolute;right:12%;top:12%;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.cap{position:absolute;left:0;right:0;top:calc(100% + 22px);text-align:center;pointer-events:none}
.cap .t{font:400 17px/1.2 'Instrument Serif',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .a{margin-top:3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

.soon{position:fixed;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.soon .rec{cursor:default}
.soon .t{font:italic 400 30px 'Instrument Serif',serif;color:var(--mute)}

/* fiche d'un disque */
.detail{position:fixed;inset:0;z-index:20;display:grid;place-items:center;visibility:hidden;overflow:auto;padding:70px 20px}
.detail.on{visibility:visible}
.veil{position:fixed;inset:0;background:rgba(246,246,243,.86);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .35s}
.detail.on .veil{opacity:1}
.card{position:relative;display:flex;gap:clamp(40px,12vw,170px);align-items:center;flex-wrap:wrap;justify-content:center;max-width:980px;
  opacity:0;transform:translateY(16px);transition:opacity .35s, transform .5s cubic-bezier(.2,.8,.2,1)}
.detail.on .card{opacity:1;transform:none}
.big{position:relative;width:min(360px, 76vw);aspect-ratio:1}
.big .disc{transform:translateX(34%);animation:spin 6s linear infinite paused}
.detail.on .big .disc{animation-play-state:running}
@keyframes spin{from{transform:translateX(34%) rotate(0)}to{transform:translateX(34%) rotate(360deg)}}
@media (max-width:700px){ .big{width:min(300px,66vw);margin-right:22vw} }
.big .sleeve{transform:none}
.info{width:min(400px, 86vw)}
.kind{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.info h2{margin-top:10px;font:400 clamp(32px,5vw,46px)/1.05 'Instrument Serif',serif}
.info .artist{margin-top:8px;font:italic 400 20px 'Instrument Serif',serif;color:#5d5c58}
.info .desc{margin-top:16px;font-size:13px;line-height:1.6;color:#55544f}
.player{margin-top:22px}
.player iframe{display:block;width:100%;border:0;border-radius:10px;background:#f4f4f2}
.links{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 18px}
.links a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid #cfcec9;padding:6px 0}
.links a:hover{border-bottom-color:var(--accent)}
.close{position:fixed;top:14px;right:clamp(16px,4vw,32px);z-index:2}
@media (prefers-reduced-motion:reduce){ .disc,.sleeve,.card,.veil{transition:none} .big .disc{animation:none} }

/* ================= Y2K : catalogue ================= */
.textbtn,.label,.kind,.links a{font-family:Michroma,Inter,system-ui,sans-serif;font-size:9px;letter-spacing:.24em}
.cap .a{font-family:Michroma,Inter,system-ui,sans-serif;font-size:7.5px;letter-spacing:.2em}
.gen .m{font-family:Michroma,Inter,system-ui,sans-serif;font-size:clamp(6px,1.3vw,7.5px);letter-spacing:.16em}
.shelf::after{height:11px;bottom:-11px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(232,238,247,.66));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid #fff;
  box-shadow:0 1px 0 #a7b0be, 0 2px 0 #f6f8fb, 0 3px 0 rgba(150,160,178,.4), 0 20px 24px -14px rgba(40,50,80,.28)}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 20deg, rgba(255,255,255,0) 0deg, rgba(255,200,240,.24) 32deg, rgba(190,220,255,.3) 62deg, rgba(255,255,255,0) 96deg,
    rgba(255,255,255,0) 200deg, rgba(200,255,235,.22) 232deg, rgba(255,240,200,.24) 262deg, rgba(255,255,255,0) 298deg)}
.gen::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;
  background:linear-gradient(120deg,#ffd6f1 0%,#d4e8ff 30%,#d2fff2 55%,#fff0d0 80%,#ffd6f1 100%)}
.sleeve::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(circle at var(--gx,30%) var(--gy,20%), rgba(255,255,255,.75), rgba(255,255,255,0) 48%)}
.rec:hover .sleeve::after{opacity:1}
.rec:hover .sleeve,.rec:focus-visible .sleeve{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px);transition:transform .12s ease-out}
.player iframe{box-shadow:0 0 0 1px #fff, 0 0 0 2px #c3cad5, 0 14px 26px -16px rgba(40,50,80,.35)}

/* ================= Y2K : grain, particules, démarrage ================= */
.grain{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .45 0 0 0 0 .47 0 0 0 0 .52 0 0 0 1 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.motes{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.motes i{position:absolute;bottom:-14px;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 35% 35%,#fff 0,rgba(226,238,255,.85) 55%,rgba(255,220,246,0) 100%);
  box-shadow:0 0 10px rgba(255,255,255,.95),0 0 3px rgba(150,175,230,.55);animation:drift linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}12%{opacity:.85}88%{opacity:.6}100%{transform:translate(var(--dx),-112vh);opacity:0}}
.boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,#ffffff 0,#f3f4f7 62%,#e7e9ee 100%);animation:bootout .8s 1.5s ease forwards}
@keyframes bootout{to{opacity:0;visibility:hidden}}
.boot .orb{width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 32% 27%,#fff 0,rgba(255,255,255,.95) 13%,rgba(255,255,255,0) 38%),
    conic-gradient(from 0deg,#ffd3f1,#d0e4ff,#cffff0,#fff2cf,#ffd3f1);
  box-shadow:inset -7px -9px 16px rgba(110,120,155,.28),0 16px 26px -12px rgba(70,80,115,.35);animation:orbspin 1.4s linear infinite}
@keyframes orbspin{to{filter:hue-rotate(360deg)}}
.boot .bootbar{position:absolute;top:calc(50% + 54px);left:50%;width:96px;height:1px;margin-left:-48px;background:rgba(40,50,80,.1);overflow:hidden}
.boot .bootbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c3cde0,#6f7f9f);animation:load 1.25s cubic-bezier(.3,0,.2,1) forwards}
@keyframes load{to{width:100%}}
@media (prefers-reduced-motion:reduce){ .boot{display:none} .motes{display:none} }

/* ================= Y2K : halo holographique + bulles de verre ================= */
.holo{position:fixed;inset:0;pointer-events:none;z-index:2;mix-blend-mode:multiply;opacity:.6;
  background:
    radial-gradient(60% 50% at 6% 10%, rgba(255,208,238,.7), rgba(255,208,238,0) 70%),
    radial-gradient(55% 45% at 94% 14%, rgba(196,220,255,.75), rgba(196,220,255,0) 70%),
    radial-gradient(60% 50% at 88% 94%, rgba(200,255,236,.65), rgba(200,255,236,0) 70%),
    radial-gradient(50% 45% at 10% 90%, rgba(255,236,196,.65), rgba(255,236,196,0) 70%);
  animation:holo 20s ease-in-out infinite alternate}
@keyframes holo{to{filter:hue-rotate(50deg)}}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bubbles b{position:absolute;border-radius:50%;animation:bob var(--d) ease-in-out infinite alternate;
  background:
    radial-gradient(circle at 31% 25%, rgba(255,255,255,.98) 0, rgba(255,255,255,.9) 6%, rgba(255,255,255,0) 19%),
    radial-gradient(circle at 68% 76%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 14%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 58%, rgba(205,222,255,.38) 71%, rgba(255,205,238,.5) 81%, rgba(204,255,236,.5) 89%, rgba(255,255,255,.9) 96.5%, rgba(255,255,255,0) 100%);
  box-shadow:0 12px 26px -14px rgba(60,80,130,.3)}
@keyframes bob{from{transform:translate(0,0)}to{transform:translate(var(--bx),var(--by))}}
@media (prefers-reduced-motion:reduce){ .holo,.bubbles b{animation:none} }
</style>
</head>
<body>

<div class="bar">
  <a class="textbtn" href="./">← La boîte</a>
  <span class="label">Catalogue</span>
</div>

<main class="rack" id="rack"></main>

<div class="soon" id="soon" hidden>
  <div style="display:flex;flex-direction:column;align-items:center;gap:44px">
    <div class="rec"><div class="disc"></div><div class="sleeve"><div class="gen"><span class="dot"></span><span></span><div class="m"><span>Service Publique</span><span></span></div></div></div></div>
    <div class="t">Bientôt.</div>
  </div>
</div>

<div class="detail" id="detail">
  <div class="veil" id="veil"></div>
  <button class="textbtn close" id="closeBtn">Fermer</button>
  <div class="card">
    <div class="big"><div class="disc"></div><div class="sleeve" id="bigSleeve"></div></div>
    <div class="info">
      <div class="kind" id="dKind"></div>
      <h2 id="dTitle"></h2>
      <div class="artist" id="dArtist"></div>
      <p class="desc" id="dDesc"></p>
      <div class="player" id="dPlayer"></div>
      <div class="links" id="dLinks"></div>
    </div>
  </div>
</div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var rack = $('rack'), detail = $('detail');
  var items = [];
  var LINKS = [['spotify', 'Spotify'], ['soundcloud', 'SoundCloud'], ['bandcamp', 'Bandcamp'], ['apple', 'Apple Music'], ['deezer', 'Deezer'], ['youtube', 'YouTube']];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function lean(i) { var v = [-1.6, 1.1, -0.6, 1.8, -1.2, 0.5]; return v[i % v.length] + 'deg'; }

  function sleeveContent(it) {
    var s = document.createDocumentFragment();
    if (it.cover) {
      var img = el('img'); img.src = it.cover; img.alt = ''; img.loading = 'lazy'; s.appendChild(img);
    } else {
      var g = el('div', 'gen');
      g.appendChild(el('span', 'dot'));
      g.appendChild(el('span', 't', it.title || ''));
      var m = el('div', 'm'); m.appendChild(el('span', '', 'Service Publique')); m.appendChild(el('span', '', it.year ? String(it.year) : ''));
      g.appendChild(m); s.appendChild(g);
    }
    return s;
  }

  function makeRecord(it, i) {
    var r = el('div', 'rec'); r.tabIndex = 0; r.setAttribute('role', 'button'); r.setAttribute('aria-label', it.title || 'Disque');
    r.appendChild(el('div', 'disc'));
    var sl = el('div', 'sleeve'); sl.style.setProperty('--lean', lean(i)); sl.appendChild(sleeveContent(it)); r.appendChild(sl);
    var cap = el('div', 'cap'); cap.appendChild(el('div', 't', it.title || '')); cap.appendChild(el('div', 'a', [it.artist, it.year].filter(Boolean).join(' · '))); r.appendChild(cap);
    r.addEventListener('click', function () { open(i); });
    r.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
    return r;
  }

  function perShelf() {
    var w = Math.min(innerWidth, 1300);
    var size = Math.max(130, Math.min(210, innerWidth * 0.36));
    return Math.max(2, Math.min(5, Math.floor((w - 60) / (size + 56))));
  }
  function render() {
    rack.innerHTML = '';
    $('soon').hidden = items.length !== 0;
    var n = perShelf();
    for (var i = 0; i < items.length; i += n) {
      var shelf = el('div', 'shelf');
      items.slice(i, i + n).forEach(function (it, k) { shelf.appendChild(makeRecord(it, i + k)); });
      rack.appendChild(shelf);
    }
  }

  function embedFor(it) {
    try {
      if (it.spotify) {
        var u = new URL(it.spotify), parts = u.pathname.split('/').filter(Boolean);
        if (parts[0] && parts[0].indexOf('intl-') === 0) parts.shift();
        if (['track', 'album', 'playlist', 'episode'].indexOf(parts[0]) >= 0 && parts[1])
          return { src: 'https://open.spotify.com/embed/' + parts[0] + '/' + parts[1], h: parts[0] === 'track' ? 152 : 352 };
      }
      if (it.soundcloud)
        return { src: 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(it.soundcloud) + '&color=%23d4432c&auto_play=false&show_user=true&show_comments=false&visual=false', h: 166 };
    } catch (e) {}
    return null;
  }

  function open(i) {
    var it = items[i]; if (!it) return;
    var bs = $('bigSleeve'); bs.innerHTML = ''; bs.appendChild(sleeveContent(it));
    $('dKind').textContent = [it.type, it.year].filter(Boolean).join(' · ');
    $('dTitle').textContent = it.title || '';
    $('dArtist').textContent = it.artist || '';
    $('dDesc').textContent = it.description || '';
    $('dDesc').hidden = !it.description;
    var p = $('dPlayer'); p.innerHTML = '';
    var em = embedFor(it);
    if (em) {
      var f = el('iframe'); f.src = em.src; f.height = em.h; f.loading = 'lazy';
      f.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
      p.appendChild(f);
    }
    var ln = $('dLinks'); ln.innerHTML = '';
    LINKS.forEach(function (l) {
      if (!it[l[0]]) return;
      var a = el('a', '', l[1]); a.href = it[l[0]]; a.target = '_blank'; a.rel = 'noopener'; ln.appendChild(a);
    });
    detail.classList.add('on');
  }
  function close() { detail.classList.remove('on'); $('dPlayer').innerHTML = ''; }
  $('closeBtn').addEventListener('click', close);
  $('veil').addEventListener('click', close);
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && detail.classList.contains('on')) close(); });

  var lastN = 0;
  addEventListener('resize', function () { var n = perShelf(); if (n !== lastN) { lastN = n; render(); } });

  fetch('catalogue.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : []; })
    .catch(function () { return []; })
    .then(function (data) {
      items = Array.isArray(data) ? data.filter(function (x) { return x && x.title; }) : [];
      lastN = perShelf();
      render();
    });
})();
</script>
<div class="holo"></div>
<div class="bubbles" id="bubbles"></div>
<div class="motes" id="motes"></div>
<div class="grain"></div>
<div class="boot" id="boot"><div class="orb"></div><div class="bootbar"><i></i></div></div>
<script>
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { if (sessionStorage.getItem('sp-boot')) document.getElementById('boot').remove(); else sessionStorage.setItem('sp-boot', '1'); } catch (e) {}
  var bub = document.getElementById('bubbles');
  if (bub) for (var k = 0; k < 7; k++) {
    var bb = document.createElement('b'), dd = 18 + Math.random() * 74;
    bb.style.width = bb.style.height = dd.toFixed(0) + 'px';
    bb.style.left = (Math.random() * 94).toFixed(1) + '%';
    bb.style.top = (4 + Math.random() * 86).toFixed(1) + '%';
    bb.style.setProperty('--d', (9 + Math.random() * 9).toFixed(1) + 's');
    bb.style.setProperty('--bx', (Math.random() * 60 - 30).toFixed(0) + 'px');
    bb.style.setProperty('--by', (Math.random() * 90 - 45).toFixed(0) + 'px');
    bb.style.animationDelay = (-Math.random() * 10).toFixed(1) + 's';
    bub.appendChild(bb);
  }
  if (reduce) return;
  var motes = document.getElementById('motes');
  for (var i = 0; i < 14; i++) {
    var m = document.createElement('i'), sz = 2 + Math.random() * 4.5;
    m.style.left = (Math.random() * 100).toFixed(1) + '%';
    m.style.width = m.style.height = sz.toFixed(1) + 'px';
    m.style.animationDuration = (18 + Math.random() * 18).toFixed(1) + 's';
    m.style.animationDelay = (-Math.random() * 36).toFixed(1) + 's';
    m.style.setProperty('--dx', (Math.random() * 90 - 45).toFixed(0) + 'px');
    motes.appendChild(m);
  }
})();
</script>
<script>
(function () {
  // pochettes qui s'inclinent sous la souris, avec un reflet
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !matchMedia('(pointer: fine)').matches) return;
  document.addEventListener('pointermove', function (e) {
    var rec = e.target.closest && e.target.closest('.rack .rec');
    document.querySelectorAll('.rack .sleeve[data-tilt]').forEach(function (s) { if (!rec || !rec.contains(s)) { s.removeAttribute('data-tilt'); s.style.removeProperty('--rx'); s.style.removeProperty('--ry'); } });
    if (!rec) return;
    var s = rec.querySelector('.sleeve'), r = rec.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    s.setAttribute('data-tilt', '1');
    s.style.setProperty('--ry', ((x - .5) * 16).toFixed(1) + 'deg');
    s.style.setProperty('--rx', ((.5 - y) * 14).toFixed(1) + 'deg');
    s.style.setProperty('--gx', (x * 100).toFixed(0) + '%');
    s.style.setProperty('--gy', (y * 100).toFixed(0) + '%');
  });
})();
</script>
</body>
</html>
